name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Make install.sh executable
        run: chmod +x install.sh

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: install.sh
